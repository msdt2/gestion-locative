<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quittance — gestion locative</title>
<meta name="description" content="Gestion locative simple : quittances, baux et états des lieux. Vos données restent dans votre navigateur.">
<meta name="theme-color" content="#12665a">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icone-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --paper: #eef1f0;
    --surface: #ffffff;
    --surface-2: #f6f8f7;
    --ink: #111d1a;
    --ink-soft: #5b6b66;
    --line: #d2dad7;
    --line-strong: #b4c0bc;
    --accent: #12665a;
    --accent-soft: #e2efec;
    --warn: #8f3a2c;
    --warn-soft: #f7e9e5;
    --radius: 10px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #101614;
      --surface: #18201e;
      --surface-2: #1e2725;
      --ink: #e8efec;
      --ink-soft: #9fb0ab;
      --line: #2c3835;
      --line-strong: #3d4c48;
      --accent: #59b8a5;
      --accent-soft: #1b2e2b;
      --warn: #e09183;
      --warn-soft: #33221e;
    }
  }
  :root[data-theme="dark"] {
    --paper: #101614;
    --surface: #18201e;
    --surface-2: #1e2725;
    --ink: #e8efec;
    --ink-soft: #9fb0ab;
    --line: #2c3835;
    --line-strong: #3d4c48;
    --accent: #59b8a5;
    --accent-soft: #1b2e2b;
    --warn: #e09183;
    --warn-soft: #33221e;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  .shell { max-width: 1120px; margin: 0 auto; padding: 20px 18px 64px; }
  header.top {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px;
    padding-bottom: 14px; border-bottom: 2px solid var(--ink);
  }
  .wordmark { font-size: 21px; font-weight: 700; letter-spacing: -0.015em; margin: 0; }
  .wordmark span { font-weight: 400; color: var(--ink-soft); }
  .storage-state { margin-left: auto; font-size: 12.5px; color: var(--ink-soft); }
  .storage-state b { font-weight: 600; color: var(--ink); }
  nav.tabs { display: flex; flex-wrap: wrap; gap: 2px; margin: 14px 0 22px; }
  nav.tabs button {
    font: inherit; font-size: 14px; font-weight: 500;
    background: transparent; color: var(--ink-soft);
    border: 1px solid transparent; border-radius: var(--radius);
    padding: 9px 14px; min-height: 44px; cursor: pointer;
  }
  nav.tabs button:hover { color: var(--ink); background: var(--surface-2); }
  nav.tabs button[aria-current="page"] { background: var(--surface); color: var(--ink); border-color: var(--line); font-weight: 600; }
  nav.tabs button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  h2.view-title { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  p.view-intro { margin: 0 0 20px; color: var(--ink-soft); max-width: 68ch; }
  section.panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 18px 20px; margin-bottom: 18px;
  }
  section.panel > h3 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  button.btn {
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    border-radius: 8px; padding: 10px 15px; min-height: 44px;
  }
  :root[data-theme="dark"] button.btn, :root:not([data-theme="light"]) button.btn { color: #06120f; }
  button.btn:hover { filter: brightness(1.08); }
  button.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
  button.btn.ghost:hover { background: var(--surface-2); filter: none; }
  button.btn.quiet {
    background: transparent; color: var(--ink-soft); border-color: transparent;
    padding: 6px 8px; min-height: 36px; font-weight: 500; text-decoration: underline;
  }
  button.btn.quiet:hover { color: var(--ink); filter: none; }
  button.btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
  .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px 14px; }
  label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--ink-soft); }
  label.field input, label.field select, label.field textarea {
    font: inherit; font-size: 15px; color: var(--ink);
    background: var(--surface-2); border: 1px solid var(--line-strong);
    border-radius: 8px; padding: 10px 11px; min-height: 44px; width: 100%;
  }
  label.check { display: flex; align-items: flex-start; gap: 9px; font-size: 13.5px; color: var(--ink); }
  label.check input { width: 18px; height: 18px; margin-top: 2px; }
  table.ledger { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  table.ledger th {
    text-align: left; font-weight: 600; font-size: 12.5px; color: var(--ink-soft);
    border-bottom: 1px solid var(--line-strong); padding: 0 10px 8px 0;
  }
  table.ledger td { padding: 11px 10px 11px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.ledger tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; }
  .scroll-x { overflow-x: auto; }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
  .tag.ok { background: var(--accent-soft); color: var(--accent); }
  .tag.late { background: var(--warn-soft); color: var(--warn); }
  .tag.part { background: var(--surface-2); color: var(--ink-soft); border: 1px solid var(--line-strong); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .stat { border-left: 3px solid var(--line-strong); padding-left: 12px; }
  .stat.is-accent { border-left-color: var(--accent); }
  .stat.is-warn { border-left-color: var(--warn); }
  .stat .k { font-size: 12.5px; color: var(--ink-soft); }
  .stat .v { font-size: 25px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .empty { color: var(--ink-soft); font-size: 14.5px; }
  .month-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .month-nav .label { font-weight: 600; font-size: 17px; min-width: 190px; }
  .hint { font-size: 13px; color: var(--ink-soft); margin: 10px 0 0; }
  .list-line { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .list-line:last-child { border-bottom: none; }
  .list-line .name { font-weight: 600; }
  .list-line .meta { color: var(--ink-soft); font-size: 13.5px; }
  .list-line .push { margin-left: auto; display: flex; gap: 6px; }
  dialog {
    border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 0;
    background: var(--surface); color: var(--ink); max-width: 520px; width: calc(100% - 32px);
  }
  dialog::backdrop { background: rgba(8, 20, 17, 0.45); }
  .dialog-body { padding: 20px; }
  .dialog-body h3 { margin: 0 0 14px; font-size: 18px; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    background: var(--ink); color: var(--paper); padding: 11px 16px; border-radius: 8px;
    font-size: 14px; font-weight: 500; max-width: 90%; z-index: 40;
  }
  .toast[hidden] { display: none; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 720px) {
    .split { grid-template-columns: 1fr; }
    .month-nav .label { min-width: 0; font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <h1 class="wordmark">Quittance<span> · gestion locative</span></h1>
    <div class="storage-state" id="storage-state">Chargement…</div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<dialog id="modal"><div class="dialog-body" id="modal-body"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';

  /* ---------------------------------------------------------------- outils */

  var MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

  function uid(prefix) {
    return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function centsFromInput(value) {
    var s = String(value === undefined || value === null ? '' : value).replace(/\s/g, '').replace(',', '.');
    var n = parseFloat(s);
    if (isNaN(n) || n < 0) return 0;
    return Math.round(n * 100);
  }
  function euros(cents) {
    var neg = cents < 0;
    var v = Math.abs(Math.round(cents || 0));
    var unit = Math.floor(v / 100);
    var dec = String(v % 100).padStart(2, '0');
    var str = String(unit).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return (neg ? '-' : '') + str + ',' + dec + ' €';
  }
  function eurosInput(cents) {
    return ((cents || 0) / 100).toFixed(2).replace('.', ',');
  }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function currentMonth() { return todayISO().slice(0, 7); }
  function monthLabel(m) {
    if (!m) return '';
    var p = m.split('-');
    return MOIS[parseInt(p[1], 10) - 1] + ' ' + p[0];
  }
  function daysInMonth(m) {
    var p = m.split('-');
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10), 0).getDate();
  }
  function addMonths(m, delta) {
    var p = m.split('-');
    var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1 + delta, 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  function frDate(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    if (p.length < 3) return iso;
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  function frDateLong(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    if (p.length < 3) return iso;
    var jour = parseInt(p[2], 10);
    return (jour === 1 ? '1er' : String(jour)) + ' ' + MOIS[parseInt(p[1], 10) - 1] + ' ' + p[0];
  }
  function monthStart(m) { return m + '-01'; }
  function monthEnd(m) { return m + '-' + String(daysInMonth(m)).padStart(2, '0'); }

  /* --------------------------------------------------------- générateur PDF */

  var HELV_W = (function () {
    var w = {};
    var base = {
      ' ':278,'!':278,'"':355,'#':556,'$':556,'%':889,'&':667,"'":191,'(':333,')':333,
      '*':389,'+':584,',':278,'-':333,'.':278,'/':278,'0':556,'1':556,'2':556,'3':556,
      '4':556,'5':556,'6':556,'7':556,'8':556,'9':556,':':278,';':278,'<':584,'=':584,
      '>':584,'?':556,'@':1015,'A':667,'B':667,'C':722,'D':722,'E':667,'F':611,'G':778,
      'H':722,'I':278,'J':500,'K':667,'L':556,'M':833,'N':722,'O':778,'P':667,'Q':778,
      'R':722,'S':667,'T':611,'U':722,'V':667,'W':944,'X':667,'Y':667,'Z':611,'[':278,
      '\\':278,']':278,'^':469,'_':556,'`':333,'a':556,'b':556,'c':500,'d':556,'e':556,
      'f':278,'g':556,'h':556,'i':222,'j':222,'k':500,'l':222,'m':833,'n':556,'o':556,
      'p':556,'q':556,'r':333,'s':500,'t':278,'u':556,'v':500,'w':722,'x':500,'y':500,
      'z':500,'{':334,'|':260,'}':334,'~':584,'\u20AC':556,'\u2019':191,'\u2018':191,
      '\u201C':333,'\u201D':333,'\u2013':556,'\u2014':1000,'\u0153':944,'\u2026':1000,
      '\u00B0':400,'\u00A0':278,'\u00E9':556,'\u00E8':556,'\u00EA':556,'\u00EB':556,
      '\u00E0':556,'\u00E2':556,'\u00E7':500,'\u00F4':556,'\u00F6':556,'\u00FB':556,
      '\u00F9':556,'\u00EE':278,'\u00EF':278,'\u00C9':667,'\u00C8':667,'\u00C0':667
    };
    for (var k in base) { if (Object.prototype.hasOwnProperty.call(base, k)) w[k] = base[k]; }
    return w;
  })();

  var WINANSI = {
    '\u20AC':0x80,'\u201A':0x82,'\u0192':0x83,'\u201E':0x84,'\u2026':0x85,'\u2020':0x86,
    '\u2021':0x87,'\u02C6':0x88,'\u2030':0x89,'\u0160':0x8A,'\u2039':0x8B,'\u0152':0x8C,
    '\u017D':0x8E,'\u2018':0x91,'\u2019':0x92,'\u201C':0x93,'\u201D':0x94,'\u2022':0x95,
    '\u2013':0x96,'\u2014':0x97,'\u02DC':0x98,'\u2122':0x99,'\u0161':0x9A,'\u203A':0x9B,
    '\u0153':0x9C,'\u017E':0x9E,'\u0178':0x9F
  };

  function pdfWidth(s, size, bold) {
    var total = 0;
    var str = String(s);
    for (var i = 0; i < str.length; i++) {
      var u = HELV_W[str.charAt(i)];
      total += (u === undefined ? 556 : u);
    }
    if (bold) total *= 1.06;
    return (total / 1000) * size;
  }
  function pdfEscape(s) {
    return String(s).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
  }
  function pdfBytes(str) {
    var out = [];
    for (var i = 0; i < str.length; i++) {
      var ch = str.charAt(i);
      var mapped = WINANSI[ch];
      if (mapped !== undefined) { out.push(mapped); continue; }
      var c = str.charCodeAt(i);
      out.push(c <= 0xff ? c : 63);
    }
    return out;
  }
  function pdfWrap(s, maxWidth, size, bold) {
    var words = String(s).split(' ');
    var lines = [];
    var line = '';
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (pdfWidth(test, size, bold) > maxWidth && line) { lines.push(line); line = words[i]; }
      else { line = test; }
    }
    if (line) lines.push(line);
    return lines;
  }
  function pageContent(items) {
    var content = '';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.t === 'line') {
        content += 'q ' + (it.lw || 0.6) + ' w ' + it.x1 + ' ' + it.y1.toFixed(2) + ' m ' + it.x2 + ' ' + it.y2.toFixed(2) + ' l S Q\n';
      } else if (it.t === 'box') {
        content += 'q ' + (it.lw || 0.6) + ' w ' + it.x.toFixed(2) + ' ' + it.y.toFixed(2) + ' ' + it.w + ' ' + it.h + ' re S Q\n';
      } else {
        var size = it.size || 10;
        var font = it.bold ? '/F2' : '/F1';
        var x = it.x;
        if (it.align === 'right') x = it.x - pdfWidth(it.s, size, it.bold);
        else if (it.align === 'center') x = it.x - pdfWidth(it.s, size, it.bold) / 2;
        content += 'BT ' + font + ' ' + size + ' Tf ' + x.toFixed(2) + ' ' + Number(it.y).toFixed(2) + ' Td (' + pdfEscape(it.s) + ') Tj ET\n';
      }
    }
    return content;
  }

  function buildPdf(pages) {
    if (!pages || !pages.length) pages = [[]];
    if (!Array.isArray(pages[0])) pages = [pages];
    var N = pages.length;
    var fReg = 3 + 2 * N;
    var fBold = 4 + 2 * N;
    var objects = [];
    var kids = [];
    for (var i = 0; i < N; i++) kids.push((3 + 2 * i) + ' 0 R');
    objects[1] = '<< /Type /Catalog /Pages 2 0 R >>';
    objects[2] = '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + N + ' >>';
    for (var p = 0; p < N; p++) {
      var c = pageContent(pages[p]);
      objects[3 + 2 * p] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 ' + fReg + ' 0 R /F2 ' + fBold + ' 0 R >> >> /Contents ' + (4 + 2 * p) + ' 0 R >>';
      objects[4 + 2 * p] = '<< /Length ' + pdfBytes(c).length + ' >>\nstream\n' + c + 'endstream';
    }
    objects[fReg] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
    objects[fBold] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
    var total = fBold;
    var out = '%PDF-1.4\n';
    var offsets = [];
    for (var n = 1; n <= total; n++) {
      offsets[n] = pdfBytes(out).length;
      out += n + ' 0 obj\n' + objects[n] + '\nendobj\n';
    }
    var xrefPos = pdfBytes(out).length;
    out += 'xref\n0 ' + (total + 1) + '\n0000000000 65535 f \n';
    for (var m = 1; m <= total; m++) {
      out += String(offsets[m]).padStart(10, '0') + ' 00000 n \n';
    }
    out += 'trailer\n<< /Size ' + (total + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF\n';
    return new Uint8Array(pdfBytes(out));
  }

  // Mise en page au fil de l'eau, pour les documents longs (bail, état des lieux).
  function Flux() {
    var M = 56, R = 539, HAUT = 792, BAS = 70;
    var pages = [];
    var items = [];
    var y = HAUT;
    function saut() { pages.push(items); items = []; y = HAUT; }
    function place(h) { if (y - h < BAS) saut(); }
    return {
      M: M, R: R,
      saut: saut,
      espace: function (h) { y -= h; },
      texte: function (s, o) {
        o = o || {};
        var size = o.size || 10;
        var indent = o.indent || 0;
        var lignes = pdfWrap(String(s), o.largeur || (R - M - indent), size, o.bold);
        for (var i = 0; i < lignes.length; i++) {
          place(size + 4);
          items.push({ t: 'text', x: M + indent, y: y, s: lignes[i], size: size, bold: o.bold });
          y -= size + (o.interligne === undefined ? 3.5 : o.interligne);
        }
        if (o.apres) y -= o.apres;
      },
      titre: function (s) {
        place(40);
        items.push({ t: 'text', x: M, y: y, s: s, size: 15, bold: true });
        y -= 24;
      },
      section: function (s) {
        place(34);
        y -= 8;
        items.push({ t: 'text', x: M, y: y, s: s, size: 11.5, bold: true });
        y -= 16;
      },
      champ: function (label, valeur) {
        var texte = label + ' : ' + (valeur === undefined || valeur === null || valeur === '' ? '……………………' : valeur);
        this.texte(texte, { size: 10 });
      },
      trait: function () {
        place(12);
        items.push({ t: 'line', x1: M, y1: y + 6, x2: R, y2: y + 6, lw: 0.6 });
        y -= 10;
      },
      aRemplir: function (label, largeur) {
        place(22);
        items.push({ t: 'text', x: M, y: y, s: label, size: 10 });
        var x0 = M + pdfWidth(label, 10, false) + 8;
        items.push({ t: 'line', x1: x0, y1: y - 2, x2: Math.min(R, x0 + (largeur || 220)), y2: y - 2, lw: 0.4 });
        y -= 19;
      },
      enTeteGrille: function (labels, xs, obsX) {
        place(20);
        for (var i = 0; i < labels.length; i++) {
          items.push({ t: 'text', x: xs[i], y: y, s: labels[i], size: 8, bold: true });
        }
        items.push({ t: 'text', x: obsX, y: y, s: 'Observations', size: 8, bold: true });
        y -= 13;
      },
      grille: function (label, xs, obsX) {
        place(19);
        items.push({ t: 'text', x: M, y: y, s: label, size: 9.5 });
        for (var i = 0; i < xs.length; i++) {
          items.push({ t: 'box', x: xs[i], y: y - 1.5, w: 9, h: 9, lw: 0.5 });
        }
        items.push({ t: 'line', x1: obsX, y1: y - 2.5, x2: R, y2: y - 2.5, lw: 0.3 });
        y -= 17;
      },
      signatures: function (colonnes) {
        place(80);
        y -= 20;
        var largeur = (R - M) / colonnes.length;
        for (var i = 0; i < colonnes.length; i++) {
          items.push({ t: 'text', x: M + i * largeur, y: y, s: colonnes[i], size: 9.5, bold: true });
          items.push({ t: 'box', x: M + i * largeur, y: y - 62, w: largeur - 16, h: 55, lw: 0.4 });
        }
        y -= 78;
      },
      coche: function (label, note) {
        place(note ? 32 : 22);
        items.push({ t: 'box', x: M, y: y - 1.5, w: 10, h: 10, lw: 0.6 });
        items.push({ t: 'text', x: M + 17, y: y, s: label, size: 10.5 });
        y -= 15;
        if (note) {
          var l = pdfWrap(note, R - M - 17, 8.5, false);
          for (var i = 0; i < l.length; i++) {
            items.push({ t: 'text', x: M + 17, y: y, s: l[i], size: 8.5 });
            y -= 11;
          }
        }
        y -= 6;
      },
      fin: function () { pages.push(items); return pages; }
    };
  }

  /* ------------------------------------------------------------------ état */

  var state = null;
  var vue = 'bord';
  var bailCourant = null;
  var moisAffiche = currentMonth();

  function etatVide() {
    return {
      version: 1,
      bailleur: { nom: '', adresse: '', ville: '', email: '' },
      biens: [], lots: [], locataires: [], baux: [], echeances: [], quittances: [],
      numeros: {},
      journal: []
    };
  }
  function normalise(data) {
    var base = etatVide();
    if (!data || typeof data !== 'object') return base;
    var keys = ['bailleur','biens','lots','locataires','baux','echeances','quittances','numeros','journal'];
    for (var i = 0; i < keys.length; i++) {
      if (data[keys[i]]) base[keys[i]] = data[keys[i]];
    }
    return base;
  }
  function journalise(type, detail) {
    state.journal.push({ ts: new Date().toISOString(), type: type, detail: detail });
    if (state.journal.length > 400) state.journal = state.journal.slice(-400);
  }

  /* -------------------------------------------------------------- stockage */

  var store = {
    mode: 'local',
    docRef: null,
    pending: null,
    saving: false,
    key: 'quittance-v1'
  };

  function libelleStockage() {
    if (store.mode === 'cloud') return 'Données enregistrées dans votre espace privé';
    return 'Données enregistrées dans ce navigateur';
  }
  function majStockage(extra) {
    var el = document.getElementById('storage-state');
    if (el) el.innerHTML = '<b>' + esc(libelleStockage()) + '</b>' + (extra ? ' · ' + esc(extra) : '');
  }

  function sauvegarde() {
    if (store.mode === 'cloud' && store.docRef) {
      store.pending = JSON.parse(JSON.stringify(state));
      videPending();
    } else {
      try {
        window.localStorage.setItem(store.key, JSON.stringify(state));
      } catch (e) {
        majStockage('sauvegarde impossible');
      }
    }
  }
  function videPending() {
    if (store.saving || !store.pending) return;
    var payload = store.pending;
    store.pending = null;
    store.saving = true;
    store.docRef.set({ data: payload, majLe: new Date().toISOString() }).then(function () {
      store.saving = false;
      majStockage('à jour');
      videPending();
    }).catch(function (err) {
      store.saving = false;
      majStockage('sauvegarde refusée (' + (err && err.code ? err.code : 'erreur') + ')');
    });
  }

  function chargeLocal() {
    try {
      var raw = window.localStorage.getItem(store.key);
      return raw ? normalise(JSON.parse(raw)) : etatVide();
    } catch (e) {
      return etatVide();
    }
  }

  function initStockage() {
    state = chargeLocal();
    rendu();
    majStockage('');
    if (!window.claude || typeof window.claude.use !== 'function') return;
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (res) {
      var db = res[0];
      var user = res[1];
      if (!db || !user) return;
      return Promise.resolve(user.id()).then(function (id) {
        if (!id) return;
        store.docRef = db.doc('data/users/' + id + '/registre');
        return store.docRef.get().then(function (snap) {
          var distant = snap && snap.exists ? snap.data() : null;
          var localVide = !state.biens.length && !state.baux.length && !state.locataires.length;
          if (distant && distant.data) {
            if (localVide) {
              state = normalise(distant.data);
            } else {
              state = normalise(distant.data);
              toast('Vos données enregistrées en ligne ont été reprises.');
            }
          }
          store.mode = 'cloud';
          majStockage('à jour');
          rendu();
          if (!distant) sauvegarde();
        });
      });
    }).catch(function () { /* on reste en local */ });
  }

  /* ------------------------------------------------------- accès au modèle */

  function bienDe(lotId) {
    var lot = trouve(state.lots, lotId);
    return lot ? trouve(state.biens, lot.bienId) : null;
  }
  function trouve(liste, id) {
    for (var i = 0; i < liste.length; i++) { if (liste[i].id === id) return liste[i]; }
    return null;
  }
  function nomLot(lotId) {
    var lot = trouve(state.lots, lotId);
    if (!lot) return 'Lot supprimé';
    var bien = trouve(state.biens, lot.bienId);
    return (bien ? bien.nom + ' · ' : '') + lot.nom;
  }
  function adresseLot(lotId) {
    var lot = trouve(state.lots, lotId);
    var bien = lot ? trouve(state.biens, lot.bienId) : null;
    if (!bien) return '';
    return bien.adresse + (lot && lot.nom ? ' (' + lot.nom + ')' : '');
  }
  function nomLocataire(id) {
    var l = trouve(state.locataires, id);
    return l ? l.nom : 'Locataire supprimé';
  }
  function idsLocataires(bail) {
    var ids = [bail.locataireId];
    (bail.colocataires || []).forEach(function (id) { if (ids.indexOf(id) === -1) ids.push(id); });
    return ids;
  }
  function nomsLocataires(bail) {
    return idsLocataires(bail).map(nomLocataire).join(', ');
  }
  function typeBailLibelle(bail) {
    if (bail.type === 'meuble') return 'location meublée';
    if (bail.type === 'colocation') return 'colocation à bail unique';
    return 'location nue';
  }
  function detailsDe(bail) {
    var d = bail.details || {};
    var defauts = {
      surface: '', nbPieces: '', periode: '', habitat: 'Immeuble collectif', copro: false,
      chauffage: 'Individuel', eauChaude: 'Individuel', autresParties: '', equipements: '',
      accessoires: '', communes: '', dpeClasse: '', dpeConso: '', idFiscal: '',
      residencePrincipale: false, depot: 0, periodicite: 'Mensuelle', terme: 'À échoir', jour: '1',
      duree: bail.type === 'meuble' ? '12' : '36', irl: '', encadrement: false,
      loyerRefMajore: 0, complement: 0, dernierLoyer: 0, dernierLoyerDate: '',
      travaux: '', mobilier: '', particulieres: '',
      piecesEdl: 'Entrée\nSéjour\nCuisine\nChambre\nSalle de bains\nWC'
    };
    for (var k in defauts) {
      if (d[k] === undefined) d[k] = defauts[k];
    }
    bail.details = d;
    return d;
  }
  function bailActif(bail, mois) {
    if (bail.debut.slice(0, 7) > mois) return false;
    if (bail.fin && bail.fin.slice(0, 7) < mois) return false;
    return true;
  }
  function totalPaye(ech) {
    var t = 0;
    for (var i = 0; i < (ech.paiements || []).length; i++) t += ech.paiements[i].montant;
    return t;
  }
  function totalDu(ech) { return ech.loyer + ech.charges; }
  function statut(ech) {
    var paye = totalPaye(ech);
    if (paye >= totalDu(ech) && totalDu(ech) > 0) return 'paye';
    if (paye > 0) return 'partiel';
    return 'impaye';
  }
  function echeanceDe(bailId, mois) {
    for (var i = 0; i < state.echeances.length; i++) {
      if (state.echeances[i].bailId === bailId && state.echeances[i].mois === mois) return state.echeances[i];
    }
    return null;
  }
  function echeancesDuMois(mois) {
    return state.echeances.filter(function (e) { return e.mois === mois; });
  }
  function quittanceDe(echId) {
    for (var i = 0; i < state.quittances.length; i++) {
      if (state.quittances[i].echeanceId === echId && !state.quittances[i].annulee) return state.quittances[i];
    }
    return null;
  }

  /* --------------------------------------------- génération des échéances */

  function genereEcheances() {
    var cree = 0;
    var limite = currentMonth();
    for (var i = 0; i < state.baux.length; i++) {
      var bail = state.baux[i];
      var mois = bail.debut.slice(0, 7);
      var borne = bail.fin ? (bail.fin.slice(0, 7) < limite ? bail.fin.slice(0, 7) : limite) : limite;
      var garde = 0;
      while (mois <= borne && garde < 600) {
        garde++;
        if (!echeanceDe(bail.id, mois)) {
          state.echeances.push(construitEcheance(bail, mois));
          cree++;
        }
        mois = addMonths(mois, 1);
      }
    }
    return cree;
  }
  function construitEcheance(bail, mois) {
    var jours = daysInMonth(mois);
    var premier = 1;
    var dernier = jours;
    var prorata = false;
    if (bail.debut.slice(0, 7) === mois) {
      premier = parseInt(bail.debut.slice(8, 10), 10);
      if (premier > 1) prorata = true;
    }
    if (bail.fin && bail.fin.slice(0, 7) === mois) {
      dernier = parseInt(bail.fin.slice(8, 10), 10);
      if (dernier < jours) prorata = true;
    }
    var couverts = Math.max(0, dernier - premier + 1);
    var ratio = couverts / jours;
    return {
      id: uid('ech'),
      bailId: bail.id,
      mois: mois,
      debut: mois + '-' + String(premier).padStart(2, '0'),
      fin: mois + '-' + String(dernier).padStart(2, '0'),
      loyer: prorata ? Math.round(bail.loyer * ratio) : bail.loyer,
      charges: prorata ? Math.round(bail.charges * ratio) : bail.charges,
      prorata: prorata,
      paiements: []
    };
  }

  /* ------------------------------------------------------------ quittances */

  function numeroSuivant(annee) {
    var n = (state.numeros[annee] || 0) + 1;
    state.numeros[annee] = n;
    return annee + '-' + String(n).padStart(4, '0');
  }

  function emetDocument(ech) {
    var bail = trouve(state.baux, ech.bailId);
    if (!bail) return null;
    var paye = totalPaye(ech);
    var du = totalDu(ech);
    var complet = paye >= du;
    var dernierPaiement = (ech.paiements || []).slice().sort(function (a, b) {
      return a.date < b.date ? -1 : 1;
    }).pop();
    var annee = ech.mois.slice(0, 4);
    var doc = {
      id: uid('qui'),
      echeanceId: ech.id,
      type: complet ? 'quittance' : 'recu',
      numero: numeroSuivant(annee),
      emisLe: todayISO(),
      mois: ech.mois,
      periodeDebut: ech.debut,
      periodeFin: ech.fin,
      locataire: nomsLocataires(bail),
      locataireId: bail.locataireId,
      adresse: adresseLot(bail.lotId),
      loyer: ech.loyer,
      charges: ech.charges,
      paye: paye,
      restant: Math.max(0, du - paye),
      payeLe: dernierPaiement ? dernierPaiement.date : todayISO(),
      bailleur: JSON.parse(JSON.stringify(state.bailleur)),
      annulee: false
    };
    state.quittances.push(doc);
    journalise(complet ? 'quittance' : 'recu', doc.numero + ' · ' + nomLot(bail.lotId) + ' · ' + ech.mois);
    return doc;
  }

    return buildPdf([items]);
  }

  function nomFichier(doc) {
    var base = (doc.type === 'quittance' ? 'quittance' : 'recu') + '-' + doc.mois + '-' + doc.locataire;
    return base.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.pdf';
  }

  function livrePdf(nom, bytes) {
    var blob = new Blob([bytes], { type: 'application/pdf' });
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then(function (dl) {
        if (!dl) return fallbackTelecharge(blob, nom);
        dl.save({ filename: nom, data: blob }).then(function () {
          toast('PDF enregistré.');
        }).catch(function (err) {
          if (err && err.code === 'declined') return;
          fallbackTelecharge(blob, nom);
        });
      }).catch(function () { fallbackTelecharge(blob, nom); });
    } else {
      fallbackTelecharge(blob, nom);
    }
  }
  function telecharge(doc) {
    livrePdf(nomFichier(doc), pdfDocument(doc));
  }
  function fallbackTelecharge(blob, nom) {
    try {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = nom;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    } catch (e) {
      toast('Téléchargement impossible dans cette fenêtre.');
    }
  }

  function nomDocument(bail, suffixe) {

  var ONGLETS = [
    { id: 'bord', nom: 'Tableau de bord' },
    { id: 'loyers', nom: 'Loyers' },
    { id: 'quittances', nom: 'Quittances' },
    { id: 'parc', nom: 'Parc' },

  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.hidden = true; }, 3200);
  }

  function rendu() {
    var tabs = document.getElementById('tabs');
    tabs.innerHTML = ONGLETS.map(function (o) {
      return '<button type="button" data-vue="' + o.id + '"' + (o.id === vue ? ' aria-current="page"' : '') + '>' + esc(o.nom) + '</button>';
    }).join('');
    var host = document.getElementById('view');
    if (vue === 'bord') host.innerHTML = vueBord();
    else if (vue === 'loyers') host.innerHTML = vueLoyers();
    else if (vue === 'quittances') host.innerHTML = vueQuittances();
    else if (vue === 'parc') host.innerHTML = vueParc();
    else if (vue === 'locataires') host.innerHTML = vueLocataires();
    else if (vue === 'baux') host.innerHTML = vueBaux();
    else if (vue === 'documents') host.innerHTML = vueDocuments();
    else host.innerHTML = vueReglages();
  }

  function vueBord() {
    var mois = currentMonth();
    var ech = echeancesDuMois(mois);
    var du = 0, paye = 0;
    ech.forEach(function (e) { du += totalDu(e); paye += totalPaye(e); });
    var retards = state.echeances.filter(function (e) {
      return e.mois < mois && statut(e) !== 'paye';
    });
    var retardMontant = 0;
    retards.forEach(function (e) { retardMontant += totalDu(e) - totalPaye(e); });

    var h = '<h2 class="view-title">' + esc(monthLabel(mois)) + '</h2>';
    h += '<p class="view-intro">Ce qui doit rentrer ce mois-ci, ce qui est arrivé, et ce qui traîne.</p>';

    if (!state.baux.length) {
      h += '<section class="panel"><h3>Commencer</h3>';
      h += '<p class="empty">Trois étapes : créez un bien et son lot, ajoutez un locataire, puis un bail. Les échéances de loyer se créent ensuite toutes seules, mois après mois.</p>';
      h += '<div class="row-actions"><button class="btn" type="button" data-action="go" data-vue="parc">Créer mon premier bien</button>';
      h += '<button class="btn ghost" type="button" data-action="demo">Charger un jeu de démonstration</button></div></section>';
      return h;
    }

    h += '<section class="panel"><div class="stats">';
    h += '<div class="stat"><div class="k">Attendu ce mois</div><div class="v">' + esc(euros(du)) + '</div></div>';
    h += '<div class="stat is-accent"><div class="k">Encaissé</div><div class="v">' + esc(euros(paye)) + '</div></div>';
    h += '<div class="stat"><div class="k">Reste à percevoir</div><div class="v">' + esc(euros(Math.max(0, du - paye))) + '</div></div>';
    h += '<div class="stat ' + (retardMontant > 0 ? 'is-warn' : '') + '"><div class="k">Retards antérieurs</div><div class="v">' + esc(euros(retardMontant)) + '</div></div>';
    h += '</div></section>';

    h += '<section class="panel"><h3>Loyers du mois</h3>' + tableauEcheances(ech, mois) + '</section>';

    if (retards.length) {
      h += '<section class="panel"><h3>Impayés des mois précédents</h3>';
      h += tableauEcheances(retards.sort(function (a, b) { return a.mois < b.mois ? -1 : 1; }), null) + '</section>';
    }
    return h;
  }

  function tableauEcheances(liste, mois) {
    if (!liste.length) {
      return '<p class="empty">Aucune échéance' + (mois ? ' pour ce mois' : '') + '. Les échéances se créent à partir des baux.</p>';
    }
    var h = '<div class="scroll-x"><table class="ledger"><thead><tr>';
    h += '<th>Logement</th><th>Locataire</th>' + (mois ? '' : '<th>Mois</th>');
    h += '<th class="num">Dû</th><th class="num">Réglé</th><th>Statut</th><th></th></tr></thead><tbody>';
    liste.forEach(function (e) {
      var bail = trouve(state.baux, e.bailId);
      if (!bail) return;
      var st = statut(e);
      var q = quittanceDe(e.id);
      h += '<tr>';
      h += '<td>' + esc(nomLot(bail.lotId)) + (e.prorata ? '<br><span class="meta" style="font-size:12.5px;color:var(--ink-soft)">prorata ' + esc(frDate(e.debut)) + ' au ' + esc(frDate(e.fin)) + '</span>' : '') + '</td>';
      h += '<td>' + esc(nomLocataire(bail.locataireId)) + '</td>';
      if (!mois) h += '<td>' + esc(monthLabel(e.mois)) + '</td>';
      h += '<td class="num">' + esc(euros(totalDu(e))) + '</td>';
      h += '<td class="num">' + esc(euros(totalPaye(e))) + '</td>';
      h += '<td><span class="tag ' + (st === 'paye' ? 'ok' : (st === 'partiel' ? 'part' : 'late')) + '">'
        + (st === 'paye' ? 'Payé' : (st === 'partiel' ? 'Partiel' : 'En attente')) + '</span></td>';
      h += '<td class="num"><div class="row-actions" style="justify-content:flex-end">';
      h += '<button class="btn ghost" type="button" data-action="paiement" data-id="' + e.id + '">Pointer</button>';
      if (q) {
        h += '<button class="btn ghost" type="button" data-action="pdf" data-id="' + q.id + '">PDF ' + (q.type === 'quittance' ? 'quittance' : 'reçu') + '</button>';
      } else {
        h += '<button class="btn" type="button" data-action="emettre" data-id="' + e.id + '"' + (totalPaye(e) <= 0 ? ' disabled' : '') + '>'
          + (st === 'paye' ? 'Quittance' : 'Reçu') + '</button>';
      }
      h += '</div></td></tr>';
    });
    h += '</tbody></table></div>';
    return h;
  }

  function champ(id, label, type, valeur, placeholder) {
    return '<label class="field">' + esc(label) + '<input id="' + id + '" type="' + type + '" value="' + esc(valeur || '') + '" placeholder="' + esc(placeholder || '') + '"></label>';
  }
  function liste(id, label, options, valeur) {
    var h = '<label class="field">' + esc(label) + '<select id="' + id + '">';
    options.forEach(function (o) {
      h += '<option value="' + esc(o) + '"' + (o === valeur ? ' selected' : '') + '>' + esc(o) + '</option>';
    });
    return h + '</select></label>';
  }
  function zone(id, label, valeur, placeholder, lignes) {
    return '<label class="field" style="grid-column:1/-1">' + esc(label)
      + '<textarea id="' + id + '" rows="' + (lignes || 3) + '" placeholder="' + esc(placeholder || '') + '">'
      + esc(valeur || '') + '</textarea></label>';
  }
  function coche(id, label, actif) {
    return '<label class="check" style="grid-column:1/-1"><input type="checkbox" id="' + id + '"' + (actif ? ' checked' : '') + '><span>' + esc(label) + '</span></label>';
  }
  function coché(id) {
    var el = document.getElementById(id);
    return !!(el && el.checked);
  }
  function val(id) {
    var el = document.getElementById(id);
    return el ? el.value.trim() : '';
  }

  function exportCsv() {
    var lignes = [['mois', 'logement', 'locataire', 'du_euros', 'regle_euros', 'statut', 'quittance']];
    state.echeances.slice().sort(function (a, b) { return a.mois < b.mois ? -1 : 1; }).forEach(function (e) {
      var bail = trouve(state.baux, e.bailId);
      if (!bail) return;
      var q = quittanceDe(e.id);
      lignes.push([
        e.mois,
        nomLot(bail.lotId),
        nomLocataire(bail.locataireId),
        (totalDu(e) / 100).toFixed(2),
        (totalPaye(e) / 100).toFixed(2),
        statut(e),
        q ? q.numero : ''
      ]);
    });
    var csv = lignes.map(function (l) {
      return l.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(';');
    }).join('\r\n');
    sauveFichier('encaissements.csv', csv, 'text/csv');
  }

  function sauveFichier(nom, contenu, mime) {
    var blob = new Blob([contenu], { type: mime });
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then(function (dl) {
        if (!dl) return fallbackTelecharge(blob, nom);
        dl.save({ filename: nom, data: blob }).then(function () { toast('Fichier enregistré.'); })
          .catch(function (err) { if (!err || err.code !== 'declined') fallbackTelecharge(blob, nom); });
      }).catch(function () { fallbackTelecharge(blob, nom); });
    } else {
      fallbackTelecharge(blob, nom);
    }
  }

  function importJson() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.addEventListener('change', function () {
      var f = input.files && input.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          state = normalise(JSON.parse(String(reader.result)));
          journalise('restauration', f.name);
          apresChangement('Sauvegarde restaurée.');
        } catch (e) {
          toast('Ce fichier n\'est pas une sauvegarde lisible.');
        }
      };
      reader.readAsText(f);
    });
    input.click();
  }

  /* ------------------------------------------------------------ évènements */

  document.addEventListener('click', function (ev) {
    var btn = ev.target.closest ? ev.target.closest('button') : null;
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    var id = btn.getAttribute('data-id');

    if (btn.hasAttribute('data-vue') && !action) {
      vue = btn.getAttribute('data-vue');
      rendu();
      document.getElementById('view').focus();
      return;
    }
    if (!action) return;

    if (action === 'go') { vue = btn.getAttribute('data-vue'); rendu(); return; }
    if (action === 'fermer') { fermeModal(); return; }
    if (action === 'confirm-oui') { fermeModal(); if (confirme._cb) confirme._cb(); return; }
    if (action === 'demo') { chargeDemo(); return; }

    if (action === 'mois') { moisAffiche = addMonths(moisAffiche, parseInt(btn.getAttribute('data-delta'), 10)); rendu(); return; }
    if (action === 'mois-courant') { moisAffiche = currentMonth(); rendu(); return; }

    if (action === 'add-bien') {
      var nom = val('bien-nom'), adresse = val('bien-adresse');
      if (!nom || !adresse) { toast('Indiquez un nom et une adresse.'); return; }
      state.biens.push({ id: uid('bien'), nom: nom, adresse: adresse });
      journalise('bien', nom);
      apresChangement('Bien ajouté.');
      return;
    }
    if (action === 'add-lot') {
      var ln = val('lot-nom-' + id);
      if (!ln) { toast('Donnez un nom au lot.'); return; }
      state.lots.push({ id: uid('lot'), bienId: id, nom: ln, surface: val('lot-surface-' + id) });
      journalise('lot', ln);
      apresChangement('Lot ajouté.');
      return;
    }
    if (action === 'del-lot') {
      var utilise = state.baux.some(function (b) { return b.lotId === id; });
      if (utilise) { toast('Ce lot porte un bail : supprimez d\'abord le bail.'); return; }
      confirme('Supprimer ce lot ?', function () {
        state.lots = state.lots.filter(function (l) { return l.id !== id; });
        apresChangement('Lot supprimé.');
      });
      return;
    }
    if (action === 'del-bien') {
      var lots = state.lots.filter(function (l) { return l.bienId === id; });
      var bloque = lots.some(function (l) { return state.baux.some(function (b) { return b.lotId === l.id; }); });
      if (bloque) { toast('Un bail existe sur ce bien : supprimez-le d\'abord.'); return; }
      confirme('Supprimer ce bien et ses lots ?', function () {
        state.lots = state.lots.filter(function (l) { return l.bienId !== id; });
        state.biens = state.biens.filter(function (b) { return b.id !== id; });
        apresChangement('Bien supprimé.');
      });
      return;
    }
    if (action === 'add-locataire') {
      var ln2 = val('loc-nom');
      if (!ln2) { toast('Le nom est obligatoire.'); return; }
      state.locataires.push({ id: uid('loc'), nom: ln2, email: val('loc-email'), tel: val('loc-tel') });
      journalise('locataire', ln2);
      apresChangement('Locataire ajouté.');
      return;
    }
    if (action === 'del-locataire') {
      var lie = state.baux.some(function (b) { return b.locataireId === id; });
      if (lie) { toast('Ce locataire a un bail : supprimez-le d\'abord.'); return; }
      confirme('Supprimer ce locataire ?', function () {
        state.locataires = state.locataires.filter(function (l) { return l.id !== id; });
        apresChangement('Locataire supprimé.');
      });
      return;
    }
    if (action === 'add-bail') {
      var loyer = centsFromInput(val('bail-loyer'));
      var debut = val('bail-debut');
      if (!debut) { toast('Indiquez la date d\'entrée.'); return; }
      if (loyer <= 0) { toast('Indiquez un loyer.'); return; }
      var fin = val('bail-fin') || null;
      if (fin && fin < debut) { toast('La date de sortie précède la date d\'entrée.'); return; }
      var consent = document.getElementById('bail-consent');
      state.baux.push({
        id: uid('bail'),
        lotId: val('bail-lot') || document.getElementById('bail-lot').value,
        locataireId: document.getElementById('bail-locataire').value,
        debut: debut, fin: fin,
        type: (function () {
          var v = val('bail-type-libelle');
          return v === 'Location meublée' ? 'meuble' : (v === 'Colocation à bail unique' ? 'colocation' : 'nu');
        })(),
        colocataires: [],
        loyer: loyer, charges: centsFromInput(val('bail-charges')),
        consentement: !!(consent && consent.checked),
        consentementDate: consent && consent.checked ? todayISO() : null
      });
      journalise('bail', 'création');
      apresChangement('Bail créé, échéances générées.');
      return;
    }
    if (action === 'documents') { bailCourant = id; vue = 'documents'; rendu(); window.scrollTo(0, 0); return; }
    if (action === 'save-details') {
      var bd = trouve(state.baux, bailCourant);
      if (!bd) return;
      var dd = detailsDe(bd);
      ['surface', 'nbPieces', 'dpeClasse', 'dpeConso', 'idFiscal', 'autresParties', 'equipements',
       'accessoires', 'communes', 'duree', 'jour', 'irl', 'travaux', 'mobilier', 'particulieres',
       'piecesEdl', 'dernierLoyerDate'].forEach(function (k) {
        var el = document.getElementById('det-' + k);
        if (el) dd[k] = el.value;
      });
      ['periode', 'habitat', 'chauffage', 'eauChaude', 'periodicite', 'terme'].forEach(function (k) {
        var el = document.getElementById('det-' + k);
        if (el) dd[k] = el.value;
      });
      ['depot', 'loyerRefMajore', 'complement', 'dernierLoyer'].forEach(function (k) {
        var el = document.getElementById('det-' + k);
        if (el) dd[k] = centsFromInput(el.value);
      });
      if (document.getElementById('det-copro')) dd.copro = coché('det-copro');
      if (document.getElementById('det-residencePrincipale')) dd.residencePrincipale = coché('det-residencePrincipale');
      if (document.getElementById('det-encadrement')) dd.encadrement = coché('det-encadrement');
      var multi = document.getElementById('det-colocataires');
      if (multi) {
        bd.colocataires = Array.prototype.slice.call(multi.selectedOptions || []).map(function (o) { return o.value; });
      }
      journalise('bail', 'informations complétées');
      sauvegarde();
      rendu();
      toast('Informations enregistrées.');
      return;
    }
    if (action === 'gen') {
      var bg = trouve(state.baux, bailCourant);
      if (!bg) return;
      if (!state.bailleur.nom) { toast('Renseignez d\'abord le bailleur dans les réglages.'); vue = 'reglages'; rendu(); return; }
      var quoi = btn.getAttribute('data-quoi');
      var pages = [];
      var nom = '';
      if (quoi === 'bail') { pages = pagesBail(bg); nom = nomDocument(bg, 'bail'); }
      else if (quoi === 'annexes') { pages = pagesAnnexes(bg); nom = nomDocument(bg, 'annexes'); }
      else if (quoi === 'entree') { pages = pagesEtatDesLieux(bg, 'entree'); nom = nomDocument(bg, 'etat-des-lieux-entree'); }
      else if (quoi === 'sortie') { pages = pagesEtatDesLieux(bg, 'sortie'); nom = nomDocument(bg, 'etat-des-lieux-sortie'); }
      else {
        pages = pagesBail(bg).concat(pagesAnnexes(bg)).concat(pagesEtatDesLieux(bg, 'entree'));
        nom = nomDocument(bg, 'dossier-location');
      }
      journalise('document', quoi + ' · ' + nomLot(bg.lotId));
      sauvegarde();
      livrePdf(nom, buildPdf(pages));
      return;
    }
    if (action === 'fin-bail') { modalFinBail(trouve(state.baux, id)); return; }
    if (action === 'save-fin') {
      var bail = trouve(state.baux, id);
      var d = val('fin-date');
      if (!bail || !d) return;
      if (d < bail.debut) { toast('La date de sortie précède la date d\'entrée.'); return; }
      bail.fin = d;
      state.echeances = state.echeances.filter(function (e) {
        if (e.bailId !== bail.id) return true;
        if (e.mois > d.slice(0, 7)) return !!quittanceDe(e.id) || totalPaye(e) > 0;
        return true;
      });
      var derniere = echeanceDe(bail.id, d.slice(0, 7));
      if (derniere && !quittanceDe(derniere.id)) {
        var maj = construitEcheance(bail, d.slice(0, 7));
        derniere.loyer = maj.loyer;
        derniere.charges = maj.charges;
        derniere.prorata = maj.prorata;
        derniere.fin = maj.fin;
      }
      journalise('bail', 'date de sortie ' + d);
      fermeModal();
      apresChangement('Date de sortie enregistrée.');
      return;
    }
    if (action === 'del-bail') {
      var aDesDocs = state.quittances.some(function (q) {
        var e = trouve(state.echeances, q.echeanceId);
        return e && e.bailId === id;
      });
      if (aDesDocs) { toast('Des quittances existent sur ce bail : il ne peut plus être supprimé.'); return; }
      confirme('Supprimer ce bail et ses échéances ?', function () {
        state.echeances = state.echeances.filter(function (e) { return e.bailId !== id; });
        state.baux = state.baux.filter(function (b) { return b.id !== id; });
        journalise('bail', 'suppression');
        apresChangement('Bail supprimé.');
      });
      return;
    }
    if (action === 'paiement') { modalPaiement(trouve(state.echeances, id)); return; }
    if (action === 'save-paiement') {
      var ech = trouve(state.echeances, id);
      if (!ech) return;
      var montant = centsFromInput(val('pay-montant'));
      if (montant <= 0) { toast('Indiquez un montant.'); return; }
      var moyenEl = document.getElementById('pay-moyen');
      ech.paiements.push({ date: val('pay-date') || todayISO(), montant: montant, moyen: moyenEl ? moyenEl.value : '' });
      journalise('paiement', euros(montant) + ' · ' + ech.mois);
      fermeModal();
      apresChangement('Paiement enregistré.');
      return;
    }
    if (action === 'del-paiement') {
      var ech2 = trouve(state.echeances, id);
      var idx = parseInt(btn.getAttribute('data-index'), 10);
      if (!ech2 || isNaN(idx)) return;
      if (quittanceDe(ech2.id)) { toast('Une quittance a été émise : annulez-la d\'abord.'); return; }
      ech2.paiements.splice(idx, 1);
      journalise('paiement', 'retrait');
      sauvegarde();
      modalPaiement(ech2);
      rendu();
      return;
    }
    if (action === 'emettre') {
      var e3 = trouve(state.echeances, id);
      if (!e3) return;
      if (!state.bailleur.nom) { toast('Renseignez d\'abord le bailleur dans les réglages.'); vue = 'reglages'; rendu(); return; }
      var doc = emetDocument(e3);
      if (!doc) return;
      sauvegarde();
      rendu();
      telecharge(doc);
      return;
    }
    if (action === 'pdf') {
      var q1 = trouve(state.quittances, id);
      if (q1) telecharge(q1);
      return;
    }
    if (action === 'email') {
      var q2 = trouve(state.quittances, id);
      if (!q2) return;
      var bailEmail = null;
      for (var i = 0; i < state.baux.length; i++) {
        if (state.baux[i].locataireId === q2.locataireId) { bailEmail = state.baux[i]; break; }
      }
      if (bailEmail && !bailEmail.consentement) {
        confirme('Ce locataire n\'a pas accepté l\'envoi par e-mail. Continuer quand même ?', function () { prepareEmail(q2); });
        return;
      }
      prepareEmail(q2);
      return;
    }
    if (action === 'annuler-quittance') {
      confirme('Annuler ce document ? Il restera visible, marqué annulé.', function () {
        var q3 = trouve(state.quittances, id);
        if (!q3) return;
        q3.annulee = true;
        journalise('annulation', q3.numero);
        apresChangement('Document annulé.');
      });
      return;
    }
    if (action === 'save-bailleur') {
      state.bailleur = { nom: val('set-nom'), adresse: val('set-adresse'), ville: val('set-ville'), email: val('set-email'), telephone: val('set-tel') };
      journalise('reglages', 'bailleur');
      apresChangement('Réglages enregistrés.');
      return;
    }
    if (action === 'export-json') {
      sauveFichier('sauvegarde-gestion-locative.json', JSON.stringify(state, null, 2), 'application/json');
      return;
    }
    if (action === 'import-json') { importJson(); return; }
    if (action === 'export-csv') { exportCsv(); return; }
    if (action === 'reset') {
      confirme('Effacer toutes les données, y compris les quittances ?', function () {
        state = etatVide();
        apresChangement('Tout est effacé.');
      });
      return;
    }
  });

  document.getElementById('modal').addEventListener('close', function () {
    document.getElementById('modal-body').innerHTML = '';
  });

  initStockage();

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* hors ligne non disponible */ });
    });
  }
})();
</script>
</body>
</html>
